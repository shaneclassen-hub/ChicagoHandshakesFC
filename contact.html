  <section class="hero"><div class="hero-inner"><h2>Contact Us</h2><p>Send a message to the manager or coach.</p></div></section>
  <main class="container">
    <div class="card">
      <form action="https://formspree.io/f/your-id" method="POST"> 
        <label>Name<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Message<textarea name="message" rows="5" required></textarea></label>
        <button class="button" type="submit">Send</button>
      </form>
      <p class="notice">Replace the <code>action</code> with your Formspree or Netlify Forms endpoint to receive submissions.</p>
    </div>
  </main>
